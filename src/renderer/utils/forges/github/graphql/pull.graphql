#import './common.graphql'

query FetchPullRequestByNumber(
  $owner: String!
  $name: String!
  $number: Int!
  $firstLabels: Int
  $lastComments: Int
  $lastReviews: Int
  $firstReviewThreads: Int
  $firstClosingIssues: Int
) {
  repository(owner: $owner, name: $name) {
    pullRequest(number: $number) {
      ...PullRequestDetails
    }
  }
}

fragment PullRequestDetails on PullRequest {
  __typename
  number
  title
  url
  state
  merged
  isDraft
  isInMergeQueue
  milestone {
    ...MilestoneFields
  }
  author {
    ...AuthorFields
  }
  comments(last: $lastComments) {
    totalCount
    nodes {
      updatedAt
      url
      author {
        ...AuthorFields
      }
      reactions {
        totalCount
      }
      reactionGroups {
        ...ReactionGroupFields
      }
    }
  }
  reviewRequests(first: 10) {
    nodes {
      requestedReviewer {
        __typename
        ... on User {
          login
        }
        ... on Team {
          __typename
        }
      }
    }
  }
  reviews(last: $lastReviews, orderBy: { field: CREATED_AT, direction: ASC }) {
    totalCount
    nodes {
      ...PullRequestReviewFields
    }
  }
  reviewThreads(first: $firstReviewThreads) {
    ...PullRequestReviewThreadConnectionFields
  }
  labels(first: $firstLabels) {
    nodes {
      ...LabelFields
    }
  }
  closingIssuesReferences(first: $firstClosingIssues) {
    nodes {
      number
    }
  }
  stackEntry @gated(requires: "stackedPullRequests") {
    position
    stack {
      size
    }
  }
  reactions {
    totalCount
  }
  reactionGroups {
    ...ReactionGroupFields
  }
}

fragment PullRequestReviewFields on PullRequestReview {
  state
  submittedAt
  url
  author {
    ...AuthorFields
  }
}

fragment PullRequestReviewThreadConnectionFields on PullRequestReviewThreadConnection {
  nodes {
    isResolved
    comments(first: 1) {
      nodes {
        author {
          login
        }
      }
    }
  }
}
