#import './common.graphql'

query FetchIssueByNumber(
  $owner: String!
  $name: String!
  $number: Int!
  $lastComments: Int
  $firstLabels: Int
  $firstIssueFieldValues: Int
) {
  repository(owner: $owner, name: $name) {
    issue(number: $number) {
      ...IssueDetails
    }
  }
}

fragment IssueDetails on Issue {
  __typename
  number
  title
  url
  state
  stateReason
  milestone {
    ...MilestoneFields
  }
  author {
    ...AuthorFields
  }
  comments(last: $lastComments) {
    totalCount
    nodes {
      url
      author {
        ...AuthorFields
      }
      reactions {
        totalCount
      }
      reactionGroups {
        ...ReactionGroupFields
      }
    }
  }
  labels(first: $firstLabels) {
    nodes {
      ...LabelFields
    }
  }
  issueType {
    name
    color
  }
  issueFieldValues(first: $firstIssueFieldValues) @gated(requires: "issueFields") {
    nodes {
      __typename
      ... on IssueFieldSingleSelectValue {
        name
        color
        field {
          ... on IssueFieldSingleSelect {
            name
          }
        }
      }
      ... on IssueFieldMultiSelectValue {
        options {
          name
          color
        }
        field {
          ... on IssueFieldMultiSelect {
            name
          }
        }
      }
      ... on IssueFieldTextValue {
        textValue: value
        field {
          ... on IssueFieldText {
            name
          }
        }
      }
      ... on IssueFieldNumberValue {
        numberValue: value
        field {
          ... on IssueFieldNumber {
            name
          }
        }
      }
      ... on IssueFieldDateValue {
        dateValue: value
        field {
          ... on IssueFieldDate {
            name
          }
        }
      }
    }
  }
  reactions {
    totalCount
  }
  reactionGroups {
    ...ReactionGroupFields
  }
}
