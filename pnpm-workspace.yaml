allowBuilds:
  '@parcel/watcher': true
  '@primer/primitives': false
  '@swc/core': true
  '@tailwindcss/oxide': true
  electron: true
  electron-winstaller: true
  esbuild: true
  unrs-resolver: true
catalog:
  electron: '43.2.0'
  # Pin the vitest family to the same version note: we need to keep this
  # in-sync with vite-plus bundled version.
  vitest: &vitest_version '4.1.10'
  '@vitest/browser-playwright': *vitest_version
  '@vitest/coverage-v8': *vitest_version
minimumReleaseAgeExclude:
  - electron-menubar
overrides:
  react-is: '19.2.8'
  # Force patched versions of transitive dev-tooling deps pulled in by
  # react-devtools (old electron/got/cross-spawn) so they don't trip security
  # scanners. None of these ship in the packaged app.
  cross-spawn: '7.0.6'
  got: '11.8.6'
  electron: 'catalog:'
  vitest: 'catalog:'
  '@vitest/browser-playwright': 'catalog:'
  '@vitest/coverage-v8': 'catalog:'
savePrefix: ''
