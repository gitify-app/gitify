allowBuilds:
  '@parcel/watcher': true
  '@primer/primitives': false
  '@swc/core': true
  '@tailwindcss/oxide': true
  electron: true
  electron-winstaller: true
  esbuild: true
  unrs-resolver: true
catalog:
  electron: '43.2.0'
minimumReleaseAgeExclude:
  - electron-menubar
overrides:
  react-is: '19.2.8'
  # Force patched versions of transitive dev-tooling deps pulled in by
  # react-devtools (old electron/got/cross-spawn) so they don't trip security
  # scanners. None of these ship in the packaged app.
  cross-spawn: '7.0.6'
  got: '11.8.6'
  electron: 'catalog:'
  # Pin the vitest family to the exact version vite-plus bundles (see the
  # "vite-plus / vitest" holds in renovate.json). `vp test` runs vite-plus's
  # own vitest; if our devDependencies resolve a different copy, both get
  # loaded into the test workers and every rejects/.resolves.toThrow()
  # assertion dies with "Cannot read properties of undefined (reading
  # 'indexOf')". Bump these together with vite-plus and the renovate cap.
  vitest: '4.1.10'
  '@vitest/browser-playwright': '4.1.10'
  '@vitest/coverage-v8': '4.1.10'
savePrefix: ''
