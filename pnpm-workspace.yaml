allowBuilds:
  '@parcel/watcher': true
  '@primer/primitives': false
  '@swc/core': true
  '@tailwindcss/oxide': true
  electron: true
  electron-winstaller: true
  esbuild: true
  unrs-resolver: true
catalog:
  electron: '43.2.0'
  # Pin the vitest family to the version vite-plus bundles internally.
  # Renovate groups vite-plus/vite/vitest/@vitest/** so they only ever move
  # together; vp migrate keeps this catalog entry aligned to whatever
  # version vite-plus bundles. See openspec/changes/fix-vite-plus-dependency-drift.
  vitest: 4.1.11
  '@vitest/browser-playwright': 4.1.11
  '@vitest/coverage-v8': 4.1.11
  vite: npm:@voidzero-dev/vite-plus-core@0.3.0
  vite-plus: 0.3.0
minimumReleaseAgeExclude:
  - electron-menubar
overrides:
  react-is: '19.2.8'
  # Force patched versions of transitive dev-tooling deps pulled in by
  # react-devtools (old electron/got/cross-spawn) so they don't trip security
  # scanners. None of these ship in the packaged app.
  cross-spawn: '7.0.6'
  got: '11.8.6'
  electron: 'catalog:'
  '@vitest/coverage-v8': 'catalog:'
  vite@*: 'catalog:'
  vitest@*: 'catalog:'
savePrefix: ''
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
