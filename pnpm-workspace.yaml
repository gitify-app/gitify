allowBuilds:
  '@parcel/watcher': true
  '@primer/primitives': false
  '@swc/core': true
  '@tailwindcss/oxide': true
  electron: true
  electron-winstaller: true
  esbuild: true
  unrs-resolver: true
catalog:
  electron: '43.2.0'
# Adopt this freshly published, first-party release ahead of pnpm's default
# minimumReleaseAge gate; it carries the Windows tray hang fix (#3064).
minimumReleaseAgeExclude:
  - electron-menubar@10.1.5
overrides:
  react-is: '19.2.8'
  # Force patched versions of transitive dev-tooling deps pulled in by
  # react-devtools (old electron/got/cross-spawn) so they don't trip security
  # scanners. None of these ship in the packaged app.
  cross-spawn: '7.0.6'
  got: '11.8.6'
  electron: 'catalog:'
savePrefix: ''
