allowBuilds:
  '@parcel/watcher': true
  '@primer/primitives': false
  '@swc/core': true
  '@tailwindcss/oxide': true
  electron: true
  electron-winstaller: true
  esbuild: true
  unrs-resolver: true
catalog:
  electron: '43.2.0'
  # Pin the vitest family to the exact version vite-plus bundles. `vp test`
  # runs vite-plus's own vitest; if our devDependencies resolve a different
  # copy, both get loaded into the test workers and every
  # rejects/.resolves.toThrow() assertion dies with "Cannot read properties
  # of undefined (reading 'indexOf')". These are overridden (below) to keep a
  # single copy, and they move in lockstep with vite-plus via the
  # "vite-plus / vitest" group in renovate.json.
  vitest: '4.1.10'
  '@vitest/browser-playwright': '4.1.10'
  '@vitest/coverage-v8': '4.1.10'
minimumReleaseAgeExclude:
  - electron-menubar
overrides:
  react-is: '19.2.8'
  # Force patched versions of transitive dev-tooling deps pulled in by
  # react-devtools (old electron/got/cross-spawn) so they don't trip security
  # scanners. None of these ship in the packaged app.
  cross-spawn: '7.0.6'
  got: '11.8.6'
  electron: 'catalog:'
  vitest: 'catalog:'
  '@vitest/browser-playwright': 'catalog:'
  '@vitest/coverage-v8': 'catalog:'
savePrefix: ''
