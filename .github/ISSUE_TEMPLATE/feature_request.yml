name: ✨ Feature Request
description: Request a new feature or enhancement
labels: [enhancement]
body:
  - type: textarea
    id: description
    attributes:
      label: 📝 Provide a description of the new feature
      description: What is the expected behavior of the proposed feature? What is the scenario this would be used?
    validations:
      required: true

  - type: dropdown
    id: relevant-forges
    attributes:
      label: Relevant Forge(s)
      description: Which forge(s) does this feature relate to? Select all that apply.
      multiple: true
      options:
        - GitHub
        - GitLab
        - Gitea / Forgejo / Codeberg
        - Bitbucket
        - All / Not applicable
    validations:
      required: false

  - type: textarea
    id: additional-information
    attributes:
      label: ➕ Additional Information
      description: Give us some additional information on the feature request like proposed solutions, links, screenshots, etc.

  - type: markdown
    attributes:
      value: If you'd like to see this feature implemented, add a 👍 reaction to this post.
