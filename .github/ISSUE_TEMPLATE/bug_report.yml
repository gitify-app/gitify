name: 🐛 Bug Report
description: Report errors or unexpected behavior
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!

        Before submitting, please check existing [issues](https://github.com/gitify-app/gitify/issues) to avoid duplicates.

        For general questions or troubleshooting, please visit our [FAQ & Documentation](https://gitify.io/faq).

  - type: textarea
    id: description
    attributes:
      label: 📝 Description
      description: Describe what happens and what you expected to happen.
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: 🪜 Steps To Reproduce
      description: List out steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 🪵 Log Excerpts
      description: |
        Share any relevant log excerpts where available.
        See [FAQ](https://gitify.io/faq) for more details.
    validations:
      required: false

  - type: input
    id: app-version
    attributes:
      label: Gitify Version
      description: What version of Gitify are you using?
      placeholder: 7.x.x
    validations:
      required: true

  - type: dropdown
    id: environment-os
    attributes:
      label: Operating System
      description: What OS are you using?
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: true

  - type: dropdown
    id: forge
    attributes:
      label: Forge
      description: Which Git forge are you using with Gitify?
      options:
        - GitHub
        - GitLab
        - Gitea / Forgejo / Codeberg
        - Bitbucket
    validations:
      required: true

  - type: input
    id: forge-variant
    attributes:
      label: Forge Variant
      description: |
        Optional. Specify the hosting variant if applicable.
        Examples: "GitHub Cloud", "GitHub Enterprise Server 3.13", "GitLab Self-Managed", "Gitea 1.22", "Codeberg", "Bitbucket Cloud"
      placeholder: e.g. GitHub Cloud, GitLab Self-Managed, Gitea 1.22
    validations:
      required: false

  - type: textarea
    attributes:
      label: 📸 Screenshots
      description: Place any screenshots of the issue here if needed.
    validations:
      required: false
