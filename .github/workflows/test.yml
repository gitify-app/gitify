name: Test

on:
  workflow_call:
    secrets:
      SONAR_TOKEN:
        required: true

permissions: {}

jobs:
  run-unit-tests:
    name: Run Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          cache: true
          node-version-file: '.nvmrc'

      - name: Run tests with coverage
        run: vp run test

      - name: Archive code coverage results
        uses: actions/upload-artifact@v7.0.2
        with:
          name: code-coverage-report
          path: coverage/lcov.info

  visual-regression:
    name: Visual Regression
    # arm64 to match `scripts/visual.sh`, which cannot generate amd64 baselines
    # because Chromium segfaults under emulation on Apple Silicon.
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: read

    # The same image the baselines were generated with. The committed
    # screenshots are comparable only against an identical browser build and
    # font stack, which a bare runner does not provide.
    #
    # This tag must match the `playwright` devDependency, which ships the
    # matching browser build. `scripts/visual.sh` derives the image from it for
    # local runs, and `src/main/ciDependencyCompatibility.test.ts` asserts the
    # two stay in sync so the version cannot drift unnoticed.
    container: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          cache: true
          node-version-file: '.nvmrc'

      - name: Run visual regression tests
        # The job already runs in the pinned image, so the script runs vitest
        # directly instead of starting another container.
        env:
          GITIFY_VISUAL_IN_CONTAINER: '1'
        run: vp run test:visual

      # Vitest writes the actual and diff images here; the reference stays in
      # __screenshots__. Download this to see what changed.
      - name: Archive visual diffs
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: visual-regression-diffs
          path: .vitest-attachments/
          include-hidden-files: true
          if-no-files-found: ignore

  sonarqube:
    name: SonarQube Cloud Analysis
    runs-on: ubuntu-latest
    needs: run-unit-tests
    permissions:
      contents: read
    # Only analyze PRs from the same repository. Limitation of SonarQube Cloud
    if: github.event.pull_request.head.repo.fork == false

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis
          persist-credentials: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          cache: true
          node-version-file: '.nvmrc'

      - name: Download a single artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: code-coverage-report
          path: coverage/

      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@v8.4.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Needed to get PR information, if any
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
