name: Lint

on:
  workflow_call:

permissions: {}

jobs:
  lint-code:
    name: Lint Code [vite-plus]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          cache: true
          node-version-file: '.nvmrc'

      - name: Run lint with GitHub annotations
        run: vp run lint:ci

      - name: Run lint and format checks
        run: vp run check

      - name: Run i18n key sync check
        run: vp run i18n:check

      - name: Run i18n lint (hardcoded strings, split sentences)
        run: vp run i18n:lint

  lint-actions:
    name: Lint GitHub Actions [actionlint]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/

      - name: Install GitHub Actions lockfile verifier
        run: gh extension install github/gh-actions-lock --pin "$GH_ACTIONS_LOCK_VERSION"
        env:
          # renovate: datasource=github-releases depName=github/gh-actions-lock
          GH_ACTIONS_LOCK_VERSION: v0.5.1
          GH_TOKEN: ${{ github.token }}

      - name: Verify GitHub Actions lockfile
        run: gh actions-lock --verify
        env:
          GH_TOKEN: ${{ github.token }}

      # Remove this once actionlint supports $/ in reusable workflow calls
      # (rhysd/actionlint#732). Verify the lockfile against the original files first.
      - name: Normalize same-repository workflow calls for actionlint
        run: |
          sed -i -E 's|^(    uses: )\$/\.github/workflows/|\1./.github/workflows/|' \
            .github/workflows/ci.yml .github/workflows/release.yml

      - name: GitHub Actions linter
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
