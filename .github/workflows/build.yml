name: Build

on:
  workflow_call:
    secrets:
      OAUTH_CLIENT_ID:
        required: true
      # Signing certificates
      CSC_LINK:
        required: true
      WIN_CSC_LINK:
        required: true
      CSC_KEY_PASSWORD:
        required: true
      WIN_CSC_KEY_PASSWORD:
        required: true

permissions: {}

jobs:
  build:
    name: Build ${{ matrix.platform }} [electron-builder]
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: macOS
            package-cmd: vp run package:macos --publish=never -c.mac.identity=null
            cleanup-path: dist/mac-universal
            artifact-name: Gitify-dist-mac
          - os: windows-latest
            platform: Windows
            package-cmd: vp run package:win --publish=never
            cleanup-path: dist/win-unpacked
            artifact-name: Gitify-dist-win
          - os: ubuntu-latest
            platform: Linux
            package-cmd: vp run package:linux --publish=never
            cleanup-path: dist/linux-unpacked
            artifact-name: Gitify-dist-linux
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          cache: true

      - name: Build application
        run: vp run build

      - name: Package for ${{ matrix.platform }}
        run: ${{ matrix.package-cmd }}
        env:
          # Signing certificates - important to use the correct cert per platform
          CSC_LINK: ${{ matrix.platform == 'macOS' && secrets.CSC_LINK || (matrix.platform == 'windows' && secrets.WIN_CSC_LINK || '') }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'macOS' && secrets.CSC_KEY_PASSWORD || (matrix.platform == 'windows' && secrets.WIN_CSC_KEY_PASSWORD || '') }}

      - name: Clean up builds
        shell: bash
        run: rm -rfv ${{ matrix.cleanup-path }}

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            dist/*
            !dist/*/
          overwrite: true
