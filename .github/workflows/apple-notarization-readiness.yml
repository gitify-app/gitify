name: Apple Notarization Readiness

on:
  pull_request:
    branches:
      - main

permissions: {}

concurrency:
  group: apple-notarization-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  readiness:
    name: Apple notarization readiness
    # This check must report on every pull request so it can be required on
    # `main`. Only release PRs need the macOS-only notary service check; every
    # other PR gets a fast no-op on Ubuntu. Running it everywhere would block
    # unrelated work whenever an Apple agreement lapses.
    runs-on: ${{ startsWith(github.head_ref, 'release-please--') && github.event.pull_request.head.repo.full_name == github.repository && 'macos-latest' || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Not a release PR
        if: ${{ !startsWith(github.head_ref, 'release-please--') || github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          message="Skipped: only release-please pull requests verify Apple notarization."
          echo "${message}"
          {
            echo "### Apple notarization readiness"
            echo ""
            echo "${message}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout trusted verification script
        if: ${{ startsWith(github.head_ref, 'release-please--') && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          # Never execute pull request code with the Apple release secrets.
          # The script comes from the base branch (main), not the release PR.
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Verify Apple notarization access
        if: ${{ startsWith(github.head_ref, 'release-please--') && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          APPLE_ID_USERNAME: ${{ secrets.APPLE_ID_USERNAME }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_ID_TEAM_ID: ${{ secrets.APPLE_ID_TEAM_ID }}
        run: ./scripts/verifyAppleNotarization.sh
