name: Renovate

on:
  push:
    branches:
      - main
    paths:
      - renovate.json
  pull_request:
    paths:
      - renovate.json

permissions: {}

jobs:
  renovate-config-validator:
    name: Config validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            renovate.json
            .nvmrc

      - uses: voidzero-dev/setup-vp@9fd26ff49f9b5e6276c2b493da4454ad4527f7f4 # v1.20.0
        with:
          cache: true
          run-install: 'false'
          node-version-file: '.nvmrc'

      - name: Validate Renovate config
        # pnpm 12 dlx ignores workspace allowBuilds (installs under ~/.cache/pnpm/dlx)
        # and fails with ERR_PNPM_IGNORED_BUILDS for renovate's optional addons.
        run: npx --yes --ignore-scripts --package renovate -- renovate-config-validator
