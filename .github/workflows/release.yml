name: Release

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      release_pr_title: ${{ steps.pr.outputs.prs_created == 'true' && fromJSON(steps.pr.outputs.pr).title || '' }}
    steps:
      - name: Run release-please (releases)
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          skip-github-pull-request: true

      - name: Check for unpublished draft releases
        id: drafts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          count=$(gh api "repos/${REPO}/releases?per_page=20" --jq '[.[] | select(.draft)] | length')
          echo "count=${count}" >> "$GITHUB_OUTPUT"

      - name: Run release-please (release PR)
        id: pr
        if: ${{ steps.release.outputs.release_created != 'true' && steps.drafts.outputs.count == '0' }}
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          skip-github-release: true

  milestones:
    name: Milestones
    needs: release-please
    if: ${{ needs.release-please.outputs.release_pr_title != '' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Ensure open milestone for upcoming release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TITLE: ${{ needs.release-please.outputs.release_pr_title }}
        run: |
          # The release-please release PR title is `chore(main): release X.Y.Z`.
          # Parse the version so the open milestone always tracks the next release.
          version=$(printf '%s' "${TITLE}" | sed -n -E 's/.*release[[:space:]]+([0-9]+\.[0-9]+\.[0-9]+).*/\1/p')
          if [ -z "${version}" ]; then
            echo "::warning::Could not parse a version from the release-please PR title '${TITLE}'"
            exit 0
          fi

          target="Release ${version}"
          open=$(gh api --method GET "repos/${REPO}/milestones?state=open&per_page=100" \
            --jq '[.[] | {number, title}]')
          count=$(printf '%s' "${open}" | jq 'length')

          if [ "${count}" -eq 0 ]; then
            gh api --method POST "repos/${REPO}/milestones" \
              -f "title=${target}" \
              -f "description=Upcoming release; merged pull requests ship in v${version}."
            echo "Created open milestone '${target}'"
          elif [ "${count}" -eq 1 ]; then
            current=$(printf '%s' "${open}" | jq -r '.[0].title')
            if [ "${current}" != "${target}" ]; then
              number=$(printf '%s' "${open}" | jq -r '.[0].number')
              # Rename (not recreate): pull requests already attached stay attached
              # and still ship in the bumped version.
              gh api --method PATCH "repos/${REPO}/milestones/${number}" -f "title=${target}"
              echo "Renamed open milestone '${current}' to '${target}'"
            else
              echo "Open milestone '${target}' already exists"
            fi
          else
            echo "::warning::Expected at most one open milestone, found ${count}; leaving them untouched"
          fi

  lint:
    name: Lint App
    uses: ./.github/workflows/lint.yml
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    permissions:
      contents: read

  tests:
    name: Tests
    uses: ./.github/workflows/test.yml
    needs: lint
    permissions:
      contents: read
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  publish:
    name: Publish
    uses: ./.github/workflows/publish.yml
    needs: [release-please, tests]
    permissions:
      contents: write
      issues: write
      pull-requests: write
    with:
      tag_name: ${{ needs.release-please.outputs.tag_name }}
    secrets:
      OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
      # Signing certificates
      CSC_LINK: ${{ secrets.CSC_LINK }}
      WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      # macOS specific
      APPLE_ID_USERNAME: ${{ secrets.APPLE_ID_USERNAME }}
      APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
      APPLE_ID_TEAM_ID: ${{ secrets.APPLE_ID_TEAM_ID }}

  website:
    name: Website
    uses: ./.github/workflows/website.yml
    needs: publish
    permissions: {}
    secrets:
      NETLIFY_BUILD_HOOK_URL: ${{ secrets.NETLIFY_BUILD_HOOK_URL }}
